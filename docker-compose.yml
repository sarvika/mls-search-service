services:
  postgis:
    image: postgis/postgis:16-3.5
    container_name: mls-search-postgis
    environment:
      POSTGRES_DB: mlssearch
      POSTGRES_USER: mlssearch
      POSTGRES_PASSWORD: mlssearch
    ports:
      # Host 5434 - 5432/5433 are already used by other local services on this machine.
      - "5434:5432"
    volumes:
      - mls-search-postgis-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mls-search-redis
    # Pure cache, no RDB/AOF persistence needed - a restart just means a cold cache,
    # not data loss. maxmemory + allkeys-lru bounds growth once real (non-demo) MLS
    # data means many more distinct bucketed search keys than the current dataset.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"

volumes:
  mls-search-postgis-data:
