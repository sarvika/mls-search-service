quarkus.application.name=mls-search-service

# Bind to a random free port during tests - avoids colliding with other services
# on this machine's default Quarkus test port (8081).
%test.quarkus.http.test-port=0

# PostGIS-backed listings database. Defaults to the local docker-compose PostGIS
# (docker-compose up -d) - override quarkus.datasource.* for a different instance.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/mlssearch
quarkus.datasource.username=mlssearch
quarkus.datasource.password=${DB_PASSWORD:mlssearch}

# Flyway owns schema creation (see src/main/resources/db/migration) - runs automatically on
# every app startup, including in tests against %test.quarkus.datasource.*.
quarkus.flyway.migrate-at-start=true

# Search-result cache (see ListingSearchCache). Defaults to the local docker-compose Redis -
# override via QUARKUS_REDIS_HOSTS for a different instance.
quarkus.redis.hosts=redis://localhost:6379

# quarkus-redis-client auto-registers a readiness health check (on by default) - disabled
# because ListingSearchCache already treats Redis as fully optional (every call caught and
# logged, never propagated). Leaving this enabled would make a k8s-style readiness probe
# fail whenever Redis is unreachable, taking down healthy search traffic for a cache outage -
# exactly what the fallback logic in ListingSearchCache exists to prevent.
quarkus.redis.health.enabled=false

# SimplyRETS demo account (simplyrets/simplyrets) - public sample data, no signup required.
# Swap to a real paid account (or MLS Grid) later by overriding these three via env vars.
mls.simplyrets.username=${SIMPLYRETS_USERNAME:simplyrets}
mls.simplyrets.password=${SIMPLYRETS_PASSWORD:simplyrets}
quarkus.rest-client.simplyrets-api.url=https://api.simplyrets.com
